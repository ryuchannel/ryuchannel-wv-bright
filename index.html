["h","캠페인 소개"],["cover"],["coverCap","대표 사진 설명·출처","","예: 사진 출처 또는 촬영 장소 (선택)"],["background","캠페인 배경","t"],["goal","캠페인 목표","t"],["impact","임팩트 숫자","t","'숫자|설명'"],
["h","콘텐츠 가이드"],["msgs","꼭 담아야 할 메시지","t","한 줄에 하나"],["cuts","필수 컷·요소","t","한 줄에 하나"],["hashtags","필수 해시태그"],["disclaimer","필수 안내 문구"],["ideas","콘텐츠 방향 예시","t","'유형|설명'"],
["h","유의사항"],["dos","이렇게 해주세요","t","한 줄에 하나"],["donts","이건 피해주세요","t","한 줄에 하나"],["safeguard","아동 보호·표현 가이드","t","한 줄에 하나"],
["h","진행 · 자료 · 문의"],["steps","진행 순서","t","'단계|설명'"],["resources","자료 링크","t","'이름|URL'"],["donateLabel","왼쪽 버튼 문구"],["donateUrl","왼쪽 버튼 URL"],["ctaLabel","오른쪽 버튼 문구"],["ctaUrl","오른쪽 버튼 URL"],["contact","담당자 정보"],["footer","하단 안내 문구 (제안 안내)"],["h","푸터 (월드비전 정보)"],["flogo"],["fintro","푸터 소개 문구"],["ftrust","신뢰 포인트","t","한 줄에 하나"]];
let S=JSON.parse(document.getElementById('data').textContent),art=null,canEdit=false;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=t=>(t||'').split('\n').map(x=>x.trim()).filter(Boolean);
const P=t=>L(t).map(l=>{const i=l.indexOf('|');return i<0?[l,'']:[l.slice(0,i).trim(),l.slice(i+1).trim()]});
const ul=(t,c='')=>`<ul class="${c}">${L(t).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
const safeUrl=u=>/^https?:\/\//.test(u)?esc(u):'#';
function pickPhoto(file,done){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const z=Math.min(1,480/Math.min(im.width,im.height)),w=im.width*z,h=im.height*z,s=Math.min(w,h),c=document.createElement('canvas');c.width=c.height=Math.round(s);c.getContext('2d').drawImage(im,(w-s)/-2,(h-s)/-2,w,h);done(c.toDataURL('image/jpeg',.85))};im.src=r.result};r.readAsDataURL(file)}
function pickCover(file,done){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const z=Math.min(1,1000/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*z);c.height=Math.round(im.height*z);c.getContext('2d').drawImage(im,0,0,c.width,c.height);done(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(file)}
function pickItem(file,done){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const w0=im.naturalWidth||im.width,h0=im.naturalHeight||im.height,m=Math.min(w0,h0),px=Math.min(720,m),c=document.createElement('canvas');c.width=c.height=px;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,px,px);x.drawImage(im,(w0-m)/2,(h0-m)/2,m,m,0,0,px,px);done(c.toDataURL('image/jpeg',.85))};im.src=r.result};r.readAsDataURL(file)}
const item=()=>{if(!(S.itemImg&&/^data:image\//.test(S.itemImg)))return'';const r=P(S.support).find(([a])=>a.replace(/\s/g,'')==='제공물품');return `<figure class="item"><img src="${S.itemImg}" alt="${esc(r&&r[1]?r[1]:'제공 물품')}">${r&&r[1]?`<figcaption>${esc(r[1])}</figcaption>`:''}</figure>`};
const cover=()=>S.cover&&/^data:image\//.test(S.cover)?`<figure class="cover"><img src="${S.cover}" alt="">${S.coverCap?`<figcaption>${esc(S.coverCap)}</figcaption>`:''}</figure>`:'';
function pickLogo(file,done){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const w0=im.naturalWidth||im.width||300,h0=im.naturalHeight||im.height||100,z=Math.min(1,480/w0),c=document.createElement('canvas');c.width=Math.round(w0*z);c.height=Math.round(h0*z);c.getContext('2d').drawImage(im,0,0,c.width,c.height);done(c.toDataURL('image/png'))};im.src=r.result};r.readAsDataURL(file)}
function footer(){return `<footer class="foot">${S.flogo&&/^data:image\//.test(S.flogo)?`<img class="lg" src="${S.flogo}" alt="월드비전">`:`<div class="lt">world vision<small>월드비전</small></div>`}
${S.footer?`<div class="nt">${esc(S.footer)}</div>`:''}
<p class="it">${esc(S.fintro)}</p><div class="tr">${L(S.ftrust).map(x=>`<span>✓ ${esc(x)}</span>`).join('')}</div></footer>`}
const avatar=()=>S.photo&&/^data:image\//.test(S.photo)?`<img class="av" src="${S.photo}" alt="">`:`<div class="av ph">WV</div>`;
function dday(d){if(!d)return'';const n=Math.ceil((new Date(d+'T23:59:59')-new Date())/864e5);return n>=0?`회신 기한 D-${n}`:'회신 기한 마감';}
const T=t=>String(t??'').trim();
const has=t=>L(t).length>0;
const docTitle=()=>(T(S.title)||'월드비전 캠페인 제안')+' · '+(T(S.to)?T(S.to)+'님께 드리는 제안':'월드비전 제안');
const okUrl=u=>/^https?:\/\//.test(T(u));
const kv=(a,b)=>`<div class="kv"><b>${esc(a)}</b><span>${esc(b)}</span></div>`;
const rows=t=>P(t).filter(([a,b])=>a||b).map(([a,b])=>kv(a,b)).join('');
const card=(h,body,c='')=>body?`<div class="card${c?' '+c:''}"><h3>${h}</h3>${body}</div>`:'';
const HIDE=new Set(['to','greeting','mname','mrole','format','deadline','support','schedule','background','goal','impact','msgs','cuts','hashtags','disclaimer','ideas','dos','donts','safeguard','steps','resources','donateLabel','donateUrl','ctaLabel','ctaUrl','contact']);
const BTN=new Set(['donateLabel','donateUrl','ctaLabel','ctaUrl']);
const note=k=>HIDE.has(k)?`<div class="emp" data-for="${k}"${T(S[k])?' hidden':''}>${BTN.has(k)?'비어 있으면 이 버튼이 페이지에서 숨겨져요 (문구와 https:// 링크가 모두 있어야 보여요)':'비어 있어서 페이지에서 숨겨져요'}</div>`:'';
function view(){
const hasPhoto=!!(S.photo&&/^data:image\//.test(S.photo));
const who=(hasPhoto||T(S.mname)||T(S.mrole))?`<div class="who">${hasPhoto?`<img class="av" src="${S.photo}" alt="">`:''}<div>${T(S.mrole)?`<small>${esc(S.mrole)}</small>`:''}${T(S.mname)?`<b>${esc(S.mname)}</b>`:''}</div></div>`:'';
const to=T(S.to)?`<b>${esc(T(S.to))}님께</b>`:'';
const greet=T(S.greeting)?esc(T(S.greeting)):'';
const msg=(who||to||greet)?`<div class="msg">${who}${to}${to&&greet?'\n':''}${greet}</div>`:'';
const cv=cover();
const intro=(cv||T(S.background)||T(S.goal)||has(S.impact))?`<h2 style="margin-top:${msg?22:0}px">캠페인 소개</h2>${cv}${card('왜 이 캠페인인가요?',T(S.background)?`<div class="pl">${esc(T(S.background))}</div>`:'')}${card('목표',T(S.goal)?`<div class="pl">${esc(T(S.goal))}</div>`:'')}${has(S.impact)?`<div class="stats">${P(S.impact).map(([a,b])=>`<div class="stat"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('')}</div>`:''}`:'';
const offerBody=(T(S.format)?kv('콘텐츠 형태',S.format):'')+rows(S.support)+item();
const sched=rows(S.schedule);
const offers=(offerBody||sched)?`<h2 style="margin-top:${(msg||intro)?22:0}px">제안 드리는 내용</h2>${offerBody?`<div class="card">${offerBody}</div>`:''}${card('📅 일정',sched)}`:'';
const s1=(msg||intro||offers)?`<section id="intro">${msg}${intro}${offers}</section>`:'';
const tagsCard=(T(S.hashtags)||T(S.disclaimer))?`<div class="card"><h3>#️⃣ 해시태그 · 안내 문구</h3>${T(S.hashtags)?`<div class="tags">${esc(S.hashtags)}</div>`:''}${T(S.disclaimer)?`<p style="margin:${T(S.hashtags)?8:0}px 0 0;color:var(--mut)">📝 ${esc(S.disclaimer)}</p>`:''}</div>`:'';
const ideasCard=has(S.ideas)?card('💡 콘텐츠 방향 예시',`<p style="margin:0 0 6px;color:var(--mut);font-size:13px">참고용이에요. 평소 계정 스타일에 맞게 자유롭게 풀어주세요.</p>${P(S.ideas).map(([a,b])=>`<p style="margin:8px 0"><b>${esc(a)}</b><br>${esc(b)}</p>`).join('')}`):'';
const g=(has(S.msgs)?card('💬 꼭 담아주세요 (메시지)',ul(S.msgs,'must')):'')+(has(S.cuts)?card('🎬 필수 컷·요소',ul(S.cuts,'must')):'')+tagsCard+ideasCard;
const s2=g?`<section id="guide"><h2>콘텐츠 가이드</h2>${g}</section>`:'';
const n=(has(S.dos)?card('⭕ 이렇게 해주세요',ul(S.dos),'do'):'')+(has(S.donts)?card('❌ 이건 피해주세요',ul(S.donts),'dont'):'')+(has(S.safeguard)?card('🛡 아동 보호 · 표현 가이드',ul(S.safeguard),'safe'):'');
const s3=n?`<section id="notice"><h2>유의사항</h2>${n}</section>`:'';
const stepsH=has(S.steps)?`<h2>진행 순서</h2>${P(S.steps).map(([a,b],i)=>`<div class="step"><div class="n">${i+1}</div><div><b>${esc(a)}</b><p>${esc(b)}</p></div></div>`).join('')}`:'';
const resH=card('📎 참고 자료',P(S.resources).filter(([a,b])=>a||b).map(([a,b])=>`<div class="kv"><a href="${safeUrl(b)}" target="_blank" rel="noopener">${esc(a)} ↗</a></div>`).join(''));
const conH=T(S.contact)?card('문의',esc(S.contact)):'';
const f=stepsH+resH+conH;
const s4=f?`<section id="flow">${f}</section>`:'';
const navL=[[s1,'intro','소개'],[s2,'guide','가이드'],[s3,'notice','유의사항'],[s4,'flow','진행']].filter(x=>x[0]).map(x=>`<a href="#${x[1]}">${x[2]}</a>`).join('');
const b1=(T(S.donateLabel)&&okUrl(S.donateUrl))?`<a class="btn sub" href="${safeUrl(T(S.donateUrl))}" target="_blank" rel="noopener">${esc(S.donateLabel)}</a>`:'';
const b2=(T(S.ctaLabel)&&okUrl(S.ctaUrl))?`<a class="btn pri" href="${safeUrl(T(S.ctaUrl))}" target="_blank" rel="noopener">${esc(S.ctaLabel)}</a>`:'';
const cta=(b1||b2)?`<div class="cta${b1&&b2?'':' one'}"><div>${b1}${b2}</div></div>`:'';
return `
${canEdit?'<button class="edit" id="eb">✎ 편집</button>':''}
<div class="wrap"${cta?'':' style="padding-bottom:0"'}>
<div class="hero"><span class="tag">${esc(S.tag)}</span><h1>${esc(S.title)}</h1><p>${esc(S.tagline)}</p>${T(S.deadline)?`<span class="dday">${dday(S.deadline)} · ${esc(S.deadline)}</span>`:''}</div>
${navL?`<nav>${navL}</nav>`:''}
${s1}${s2}${s3}${s4}
${footer()}</div>
${cta}`}
function editor(){return `<div class="panel"><div class="in"><h2>제안 페이지 내용 편집</h2><small>수정 후 '저장 · 게시'를 누르면 링크로 보는 모든 분께 반영돼요.</small>
${SCHEMA.map(f=>f[0]==='h'?`<h4>${f[1]}</h4>`:f[0]==='flogo'?`<label>푸터 로고 <small>(투명 배경 PNG·SVG 권장 · 올리지 않으면 텍스트 로고가 표시돼요)</small></label>${S.flogo?`<div style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0"><img src="${S.flogo}" style="max-height:40px"></div>`:''}<input type="file" accept="image/*" id="lf"> <button class="btn sub" id="ld" style="padding:6px 12px;font-size:13px;margin-top:6px;display:inline-block">삭제</button>`:f[0]==='item'?`<label>제공 물품 사진 <small>(선택 · 가운데 기준 정사각형으로 잘려 저장돼요. 정사각형 사진을 올리면 가장 좋아요)</small></label>${S.itemImg?`<img class="thumb" src="${S.itemImg}" alt="">`:''}<input type="file" accept="image/*" id="itf"> <button class="btn sub" id="itd" style="padding:6px 12px;font-size:13px;margin-top:6px;display:inline-block">삭제</button>`:f[0]==='cover'?`<label>캠페인 대표 사진 <small>(가로 사진 권장 · 최대 가로 1000px로 줄여 저장돼요)</small></label>${S.cover?`<img src="${S.cover}" style="width:100%;max-height:240px;object-fit:contain;border-radius:10px;margin:6px 0;background:var(--pri2)">`:''}<input type="file" accept="image/*" id="cf"> <button class="btn sub" id="cd" style="padding:6px 12px;font-size:13px;margin-top:6px;display:inline-block">삭제</button>`:f[0]==='photo'?`<label>담당자 사진 <small>(정사각형으로 잘려 저장돼요. 한 번 등록하면 기본 이미지로 계속 쓰여요 · 비워두면 사진 없이 이름·직함만 보여요)</small></label><div class="who" style="margin-top:6px">${avatar()}<div><input type="file" accept="image/*" id="pf"><button class="btn sub" id="pd" style="padding:6px 12px;font-size:13px;margin-top:6px;display:inline-block">사진 삭제</button></div></div>`:`<label>${f[1]} ${f[3]?`<small>(${f[3]})</small>`:''}</label>${f[2]==='t'?`<textarea data-k="${f[0]}">${esc(S[f[0]])}</textarea>`:`<input data-k="${f[0]}" ${f[2]==='d'?'type="date"':''} value="${esc(S[f[0]])}">`}${note(f[0])}`).join('')}
</div></div><div class="bar" style="z-index:25"><button class="btn sub" id="cx">닫기</button><button class="btn pri" id="sv">저장 · 게시</button></div>`}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function render(ed){document.title=docTitle();const a=document.getElementById('app');a.innerHTML=view()+(ed?editor():'');
 const eb=document.getElementById('eb');if(eb)eb.onclick=()=>render(true);
 if(ed){const f=()=>document.querySelectorAll('[data-k]').forEach(e=>S[e.dataset.k]=e.value);
  document.querySelectorAll('[data-k]').forEach(e=>e.addEventListener('input',()=>{const n=document.querySelector('.emp[data-for="'+e.dataset.k+'"]');if(n)n.hidden=!!T(e.value)}));
  document.getElementById('lf').onchange=e=>{const fl=e.target.files[0];if(fl){f();pickLogo(fl,u=>{S.flogo=u;const y=document.querySelector('.panel').scrollTop;render(true);document.querySelector('.panel').scrollTop=y})}};
  document.getElementById('ld').onclick=()=>{f();S.flogo='';const y=document.querySelector('.panel').scrollTop;render(true);document.querySelector('.panel').scrollTop=y};
  document.getElementById('itf').onchange=e=>{const fl=e.target.files[0];if(fl){f();pickItem(fl,u=>{S.itemImg=u;const y=document.querySelector('.panel').scrollTop;render(true);document.querySelector('.panel').scrollTop=y})}};
  document.getElementById('itd').onclick=()=>{f();S.itemImg='';const y=document.querySelector('.panel').scrollTop;render(true);document.querySelector('.panel').scrollTop=y};
  document.getElementById('cf').onchange=e=>{const fl=e.target.files[0];if(fl){f();pickCover(fl,u=>{S.cover=u;const y=document.querySelector('.panel').scrollTop;render(true);document.querySelector('.panel').scrollTop=y})}};
  document.getElementById('cd').onclick=()=>{f();S.cover='';const y=document.querySelector('.panel').scrollTop;render(true);document.querySelector('.panel').scrollTop=y};
  document.getElementById('pf').onchange=e=>{const fl=e.target.files[0];if(fl){f();pickPhoto(fl,u=>{S.photo=u;const y=document.querySelector('.panel').scrollTop;render(true);document.querySelector('.panel').scrollTop=y})}};
  document.getElementById('pd').onclick=()=>{f();S.photo='';const y=document.querySelector('.panel').scrollTop;render(true);document.querySelector('.panel').scrollTop=y};
  document.getElementById('cx').onclick=()=>{f();render(false)};
  document.getElementById('sv').onclick=async()=>{f();try{const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelectorAll('title').forEach(t=>t.textContent=docTitle());c.querySelector('#data').textContent=JSON.stringify(S).replace(/</g,'\\u003c');await art.publish('<!DOCTYPE html>\n'+c.outerHTML);toast('게시 중…')}catch(e){toast(e&&e.code==='conflict'?'다른 편집이 먼저 반영됐어요':'저장 권한이 없어요')}}}}
render(false);
(async()=>{try{if(!window.claude)return;const u=await claude.use('user');art=await claude.use('artifact');canEdit=!!(art&&u&&u.canEdit());if(canEdit)render(false)}catch(e){}})();
</script>
</body>
</html>
